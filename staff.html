<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>打刻 | 住岡</title>
  <!-- 共通スタイル・共通JSモジュール（common/フォルダ配下。styles.css より先に何も読み込まないこと） -->
  <link rel="stylesheet" href="common/styles.css">
  <script src="common/api.js"></script>
  <script src="common/storage.js"></script>
  <script src="common/ui.js"></script>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%231a7f37'/><text y='.9em' font-size='75' x='50%' text-anchor='middle' fill='white'>打</text></svg>">
  <meta name="theme-color" content="#1a7f37">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="住岡打刻">

  <link rel="stylesheet" href="staff/staff.css">
</head>
<body>

<!-- ローディング/トースト表示は ui.js が動的に要素を生成するため、
     静的なプレースホルダーは不要（2026-07-29 削除） -->

<!-- ドロワーオーバーレイ -->
<div class="drawer-overlay" id="drawer-overlay" onclick="closeTaskDrawer()"></div>

<!-- ===== ログイン画面 ===== -->
<div id="screen-login">
  <div class="login-card">
    <div class="login-logo">打</div>
    <div class="login-title">住岡 打刻システム</div>
    <div class="login-subtitle">PIN とパスワードでログイン</div>

    <label class="field-label" for="input-pin">PIN（4桁）</label>
    <input class="field-input" type="tel" id="input-pin"
      inputmode="numeric" maxlength="4" placeholder="1234"
      autocomplete="off">

    <label class="field-label" for="input-password">パスワード</label>
    <input class="field-input" type="password" id="input-password"
      placeholder="パスワードを入力" autocomplete="current-password">

    <button class="btn-login" id="btn-login">ログイン</button>
    <div class="login-hint">PIN・パスワードは管理者にお問い合わせください</div>
  </div>
</div>

<!-- ===== メイン画面 ===== -->
<div id="screen-main">

  <!-- ヘッダー -->
  <header class="app-header">
    <div class="app-header-title">住岡 打刻</div>
    <div class="header-user" id="header-username"></div>
    <button class="header-notif-btn" id="btn-notif" onclick="switchPanel('notifications')" title="通知">
      🔔
      <span class="notif-badge" id="notif-badge"></span>
    </button>
    <a class="header-admin-link" id="admin-link" href="admin.html">⚙️ 管理</a>
    <button class="header-logout-btn" id="btn-logout">ログアウト</button>
  </header>

  <!-- コンテンツ -->
  <main class="content-area">

    <!-- ── 打刻パネル ── -->
    <section class="panel active" id="panel-clock">

      <!-- 時計 -->
      <div class="clock-display">
        <div class="clock-time" id="live-clock">--:--</div>
        <div class="clock-date" id="live-date"></div>
      </div>

      <!-- ステータスチップ -->
      <div class="status-bar">
        <div class="status-chip" id="chip-checkin">
          出勤
          <span class="chip-val" id="chip-checkin-val">-</span>
        </div>
        <div class="status-chip" id="chip-checkout">
          退勤
          <span class="chip-val" id="chip-checkout-val">-</span>
        </div>
        <div class="status-chip" id="chip-lunch">
          弁当
          <span class="chip-val" id="chip-lunch-val">-</span>
        </div>
      </div>

      <!-- 出勤前 -->
      <div id="block-before-checkin">
        <div class="card">
          <div class="card-title">弁当 — 今日いる？</div>
          <div class="lunch-row">
            <button class="lunch-btn" id="lunch-yes" onclick="selectLunch(true)">
              <span class="lunch-icon">🍱</span>
              いる
            </button>
            <button class="lunch-btn" id="lunch-no" onclick="selectLunch(false)">
              <span class="lunch-icon">✖</span>
              いらない
            </button>
          </div>
        </div>
        <button class="clock-btn clock-btn-checkin" id="btn-checkin" disabled>
          <span class="clock-btn-icon">🟢</span>
          出勤打刻
        </button>
      </div>

      <!-- 出勤後・退勤前 -->
      <div id="block-after-checkin" style="display:none">
        <div class="card">
          <div class="card-title">退勤前に入力</div>

          <label class="report-label">今日の日報</label>
          <textarea class="report-textarea" id="input-report"
            placeholder="本日の作業内容・所感を入力してください"></textarea>

          <label class="report-label" style="margin-top:10px">引継ぎ事項（任意）</label>
          <textarea class="report-textarea" id="input-handover"
            placeholder="次の担当者への引継ぎがあれば入力してください" style="min-height:60px"></textarea>

          <label class="report-label" style="margin-top:10px">休憩時間</label>
          <select class="break-select" id="select-break">
            <option value="">選択してください</option>
            <option value="0">0分（休憩なし）</option>
            <option value="30">30分</option>
            <option value="45">45分</option>
            <option value="60">60分（1時間）</option>
            <option value="75">75分</option>
            <option value="90">90分</option>
            <option value="120">120分（2時間）</option>
          </select>
        </div>
        <button class="clock-btn clock-btn-checkout" id="btn-checkout" disabled>
          <span class="clock-btn-icon">🔵</span>
          退勤打刻
        </button>
      </div>

      <!-- 退勤済み -->
      <div id="block-done" style="display:none">
        <div class="done-banner">
          <div class="done-icon">✅</div>
          <div class="done-text">お疲れさまでした！</div>
          <div class="done-sub" id="done-times"></div>
        </div>
      </div>
    </section>
    <!-- /panel-clock -->

    <!-- ── タスクパネル ── -->
    <section class="panel" id="panel-tasks">
      <div class="section-title">📋 本日のタスク</div>
      <div id="task-list-wrap">
        <div class="empty-state">
          <div class="empty-icon">📭</div>
          <div class="empty-text">読み込み中...</div>
        </div>
      </div>
    </section>

    <!-- ── 相談パネル ── -->
    <section class="panel" id="panel-consult">

      <!-- 送信フォーム -->
      <div class="consult-form">
        <div class="consult-form-title">相談を送る</div>
        <input class="consult-input" type="text" id="consult-title"
          placeholder="件名（例：〇〇案件について相談したい）">
        <textarea class="consult-textarea" id="consult-message"
          placeholder="相談内容を入力してください"></textarea>

        <div class="report-label" style="margin-bottom:8px">送信先（複数可）</div>
        <div class="recipient-list" id="recipient-list">
          <!-- JS で動的生成 -->
        </div>

        <button class="btn-send" id="btn-send-consult">送信する</button>
      </div>

      <!-- 送信済み相談 -->
      <div class="section-title">📨 送信済みの相談</div>
      <div class="consult-list" id="consult-list">
        <div class="empty-state">
          <div class="empty-icon">📭</div>
          <div class="empty-text">送信済みの相談はありません</div>
        </div>
      </div>
    </section>

    <!-- ── 通知パネル ── -->
    <section class="panel" id="panel-notifications">
      <button class="btn-read-all" id="btn-read-all">すべて既読にする</button>
      <div class="notif-list" id="notif-list">
        <div class="empty-state">
          <div class="empty-icon">🔔</div>
          <div class="empty-text">通知はありません</div>
        </div>
      </div>
    </section>

  </main><!-- /content-area -->

  <!-- ボトムナビゲーション -->
  <nav class="bottom-nav">
    <button class="nav-btn active" id="nav-clock" onclick="switchPanel('clock')">
      <span class="nav-icon">🕐</span>打刻
    </button>
    <button class="nav-btn" id="nav-tasks" onclick="switchPanel('tasks')">
      <span class="nav-icon">📋</span>タスク
    </button>
    <button class="nav-btn" id="nav-consult" onclick="switchPanel('consult')">
      <span class="nav-icon">💬</span>相談
    </button>
    <button class="nav-btn" id="nav-notifications" onclick="switchPanel('notifications')">
      <span class="nav-icon">🔔</span>通知
    </button>
  </nav>

</div><!-- /screen-main -->

<!-- タスク詳細ドロワー -->
<div class="drawer" id="task-drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-task-title">
  <div class="drawer-handle"></div>

  <!-- 差戻理由 -->
  <div class="reject-reason-box" id="reject-reason-box"></div>

  <div class="drawer-title" id="drawer-task-title"></div>

  <div class="drawer-section">
    <div class="drawer-section-label">ステータス</div>
    <div class="drawer-section-val" id="drawer-task-status"></div>
  </div>

  <div class="drawer-section" id="drawer-desc-section" style="display:none">
    <div class="drawer-section-label">作業内容</div>
    <div class="drawer-section-val" id="drawer-task-desc"></div>
  </div>

  <div class="drawer-section" id="drawer-cond-section" style="display:none">
    <div class="drawer-section-label">完了条件</div>
    <div class="drawer-section-val" id="drawer-task-cond"></div>
  </div>

  <div class="drawer-section" id="drawer-due-section" style="display:none">
    <div class="drawer-section-label">期限</div>
    <div class="drawer-section-val" id="drawer-task-due"></div>
  </div>

  <!-- ステータス変更ボタン -->
  <div class="drawer-section">
    <div class="drawer-section-label">ステータスを変更</div>
    <div class="status-change-row" id="status-change-row"></div>
  </div>

  <div class="divider"></div>

  <!-- コメント -->
  <div class="drawer-section">
    <div class="drawer-section-label">作業コメントを追加</div>
    <textarea class="comment-input" id="drawer-comment" placeholder="本日の作業内容を入力してください"></textarea>
    <button class="btn-comment-save" id="btn-comment-save">コメントを保存</button>
  </div>

  <!-- コメント履歴 -->
  <div class="drawer-section" id="drawer-comments-section" style="display:none">
    <div class="drawer-section-label">コメント履歴</div>
    <div class="comment-list" id="drawer-comment-list"></div>
  </div>
</div>


<!-- staff/ 配下: 責務ごとに分割したJS。依存順に読み込む
     （utils → staff → attendance/task/drawer/consult/notification）。
     すべて非モジュールのクラシックスクリプトなので、staff.js で定義した
     state・api()・GAS_URL 等は後続スクリプトからもそのまま参照できる。 -->
<script src="staff/utils.js"></script>
<script src="staff/staff.js"></script>
<script src="staff/attendance.js"></script>
<script src="staff/task.js"></script>
<script src="staff/drawer.js"></script>
<script src="staff/consult.js"></script>
<script src="staff/notification.js"></script>
</body>
</html>
